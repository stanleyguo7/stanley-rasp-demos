<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9f7cf">
  <title>小鹿闪闪 · 森林闯关</title>
  <style>
    :root { font-family: ui-rounded, "Nunito", "PingFang SC", "Microsoft YaHei", sans-serif; color:#34583d; background:#e9f7cf; }
    * { box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
    body { margin:0; min-height:100dvh; display:grid; place-items:center; background:radial-gradient(circle at 20% 10%,#fff9d9 0,#e8f7cc 45%,#c8e9c3 100%); overflow:hidden; }
    .wrap { width:min(100vw,1120px); padding:12px; }
    .top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 auto 10px; max-width:1000px; }
    .brand { display:flex; align-items:center; gap:8px; font-weight:1000; font-size:clamp(18px,2.5vw,27px); letter-spacing:.03em; text-shadow:0 2px #fff; white-space:nowrap; }
    .brand .icon { font-size:31px; }
    .pill { background:#fffdf2; border:2px solid #afd893; border-radius:999px; padding:8px 14px; box-shadow:0 5px 0 #aacb87; font-weight:900; white-space:nowrap; }
    .stats { display:flex; gap:8px; align-items:center; }
    button { font:inherit; cursor:pointer; touch-action:manipulation; }
    .small { border:2px solid #9bc67c; background:#fffdf2; color:#436747; border-radius:14px; padding:8px 12px; font-weight:900; box-shadow:0 4px 0 #aacb87; }
    .small:active,.primary:active { transform:translateY(3px); box-shadow:0 1px 0 #aacb87; }
    .stage { position:relative; max-width:1000px; margin:auto; border:6px solid #fffdf0; border-radius:28px; overflow:hidden; box-shadow:0 16px 0 #a9cf8b,0 24px 45px #64946555; background:#a9de81; }
    canvas { display:block; width:100%; aspect-ratio:1000/620; touch-action:none; }
    .overlay { position:absolute; inset:0; display:grid; place-items:center; background:#e9f8d7ad; backdrop-filter:blur(5px); padding:22px; }
    .overlay[hidden] { display:none; }
    .card { width:min(90%,430px); background:#fffdf2; border:4px solid #fff; border-radius:30px; box-shadow:0 12px 0 #a9d18b,0 20px 35px #426b4150; padding:28px 24px 24px; text-align:center; }
    .mascot { font-size:64px; display:block; line-height:1.1; animation:bob 2s ease-in-out infinite; }
    @keyframes bob { 50% { transform:translateY(-8px) rotate(7deg); } }
    h1 { font-size:clamp(26px,5vw,40px); margin:10px 0 7px; color:#467850; }
    p { line-height:1.65; margin:8px 0 20px; font-weight:700; color:#627b5a; }
    .primary { border:0; border-radius:18px; padding:13px 35px; color:#fff; font-size:20px; font-weight:1000; background:linear-gradient(#ffb65a,#f38845); box-shadow:0 6px 0 #c46d3c; }
    .hint { max-width:1000px; margin:18px auto 0; display:flex; align-items:center; justify-content:space-between; gap:8px; font-weight:800; color:#608361; font-size:14px; }
    .touch { display:none; gap:7px; }
    .touch button { width:47px; height:42px; border-radius:13px; border:2px solid #a8cf96; background:#fffdf2; color:#547b52; font-size:21px; font-weight:1000; box-shadow:0 3px 0 #a8cf96; }
    @media (pointer:coarse), (max-width:700px) { .touch { display:flex; } .hint .desktop { display:none; } .wrap { padding:7px; } .stage { border-width:4px; border-radius:18px; } .top { gap:4px; margin-bottom:7px; } .brand { font-size:16px; } .brand .icon { font-size:20px; } .pill { padding:5px 8px; font-size:12px; } .small { padding:5px 7px; font-size:12px; } .stats { gap:4px; } .hint { margin-top:10px; font-size:12px; } }
    @media (max-width:650px) and (orientation:portrait) { body { display:block; } .wrap { width:100%; padding:8px; } canvas { aspect-ratio:520/620; } .top { flex-wrap:wrap; justify-content:center; } .brand { width:100%; justify-content:center; } .hint { flex-direction:column; text-align:center; } .touch button { width:58px; height:48px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <div class="brand"><span class="icon">🦌</span> 小鹿闪闪</div>
      <div class="stats"><div class="pill" id="levelText">第 1 关</div><div class="pill" id="starsText">⭐ 0 / 3</div><div class="pill" id="heartsText">❤️❤️❤️</div><button class="small" id="pauseBtn" aria-label="暂停游戏">暂停</button></div>
    </div>
    <div class="stage"><canvas id="game" width="1000" height="620" aria-label="小鹿闪闪游戏画面"></canvas>
      <div class="overlay" id="overlay"><div class="card"><span class="mascot" id="modalIcon">🦌</span><h1 id="modalTitle">小鹿闪闪</h1><p id="modalText">帮小鹿收集三颗星星，躲开滚动木桩和忙碌的小蜜蜂，到达彩虹门！</p><button class="primary" id="actionBtn">开始冒险</button></div></div>
    </div>
    <div class="hint"><span class="desktop">方向键 / WASD 移动 · 收集星星后进入右侧彩虹门 · 空格暂停</span><span>触屏可按方向键，也可在画面上拖动小鹿</span><div class="touch"><button data-dir="left" aria-label="向左">◀</button><button data-dir="up" aria-label="向上">▲</button><button data-dir="down" aria-label="向下">▼</button><button data-dir="right" aria-label="向右">▶</button></div></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
